PACKAGE_NAME="aic8800"
PACKAGE_VERSION="1.0.0"
AUTOINSTALL="yes"

# DKMS expands ${kernelver} and ${kernel_source_dir} while reading this file.
MAKE[0]="make -C drivers/aic8800 KVER=${kernelver} KDIR=${kernel_source_dir} modules"
CLEAN="make -C drivers/aic8800 KVER=${kernelver} KDIR=${kernel_source_dir} clean"

# Location is concatenated with the module name, so the trailing slash is required.
BUILT_MODULE_NAME[0]="aic_load_fw"
BUILT_MODULE_LOCATION[0]="drivers/aic8800/aic_load_fw/"
DEST_MODULE_LOCATION[0]="/updates/dkms"

BUILT_MODULE_NAME[1]="aic8800_fdrv"
BUILT_MODULE_LOCATION[1]="drivers/aic8800/aic8800_fdrv/"
DEST_MODULE_LOCATION[1]="/updates/dkms"

BUILT_MODULE_NAME[2]="aic_zlp_quirk"
BUILT_MODULE_LOCATION[2]="drivers/aic8800/aic_zlp_quirk/"
DEST_MODULE_LOCATION[2]="/updates/dkms"

POST_INSTALL="install_setup.sh"
